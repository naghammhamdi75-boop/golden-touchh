<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — Golden Touch</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://images.unsplash.com"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin></head><body><div id="app-header"></div><main><div class="form-wrap"><div class="breadcrumb"><a href="index.html">Accueil</a> &gt; Connexion</div><form id="login-form" class="form-card"><span class="eyebrow">HEUREUX DE VOUS REVOIR</span><h2>Connexion</h2><p>Accédez à votre espace Golden Touch.</p><div class="field"><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">Mot de passe</label><input id="password" name="password" type="password" required autocomplete="current-password"></div><button class="btn btn-gold" type="submit">Se connecter</button><div id="form-message" class="message" role="status"></div><div class="form-foot">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></div></form><div class="notice">La connexion persistante nécessite une configuration Supabase. En mode démonstration, créez une session depuis la page d'inscription.</div></div></main><div id="app-footer"></div><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="supabase-config.js"></script><script defer src="app.js"></script></body></html>
