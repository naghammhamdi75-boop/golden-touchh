<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — Golden Touch</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://images.unsplash.com"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin></head><body><div id="app-header"></div><main><section class="page-intro"><div class="breadcrumb"><a href="index.html">Accueil</a> &gt; Contact</div><span class="eyebrow">ÉCHANGEONS ENSEMBLE</span><h1>Nous contacter</h1><p>Une question sur une pièce ou sur le projet ? Laissez-nous un message.</p></section><div class="form-wrap"><form id="contact-form" class="form-card"><div class="field"><label>Votre nom</label><input required name="name"></div><div class="field"><label>Votre e-mail</label><input required type="email" name="email"></div><div class="field"><label>Votre message</label><textarea required rows="5" name="message"></textarea></div><button class="btn btn-gold">Envoyer le message</button><p id="contact-message" class="message" role="status"></p></form><div class="notice">Coordonnées à renseigner. Le formulaire est une démonstration : aucun e-mail n'est envoyé.</div></div></main><div id="app-footer"></div><script defer src="app.js"></script></body></html>
